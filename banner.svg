<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="hunqp - embedded linux, ip cameras, real-time video">
  <rect width="1200" height="220" rx="10" fill="#0d1117"/>

  <!-- faint grid -->
  <g stroke="#161b22" stroke-width="1">
    <path d="M0 55H1200M0 110H1200M0 165H1200"/>
    <path d="M150 0V220M300 0V220M450 0V220M600 0V220M750 0V220M900 0V220M1050 0V220"/>
  </g>

  <!-- logic analyzer traces -->
  <g fill="none" stroke-linejoin="miter" stroke-width="2">
    <path stroke="#2f81f7" opacity=".9" d="M640 62h40v-24h30v24h60v-24h20v24h40v-24h70v24h30v-24h40v24h50v-24h30v24h60v-24h20v24h70"/>
    <path stroke="#3fb950" opacity=".8" d="M640 112h70v-24h20v24h30v-24h60v24h40v-24h30v24h80v-24h20v24h50v-24h60v24h30v-24h40v24h30"/>
    <path stroke="#8b949e" opacity=".7" d="M640 162h20v-24h20v24h20v-24h20v24h20v-24h20v24h20v-24h20v24h20v-24h20v24h20v-24h20v24h20v-24h20v24h20v-24h20v24h20v-24h20v24h20v-24h20v24h20v-24h20v24h20v-24h20v24h20v-24h20v24h40"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6e7681">
    <text x="600" y="56">SDA</text>
    <text x="600" y="106">SCL</text>
    <text x="600" y="156">CLK</text>
  </g>

  <!-- text -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="98" font-size="44" font-weight="700" fill="#e6edf3"><tspan fill="#3fb950">$</tspan> hunqp</text>
    <text x="58" y="140" font-size="18" fill="#8b949e">embedded linux / ip cameras / real-time video</text>
    <text x="58" y="170" font-size="15" fill="#6e7681">C/C++ on SoCs and microcontrollers</text>
