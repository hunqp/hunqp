<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Pham Nguyen Quoc Hung - Embedded Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#101b33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset=".35" stop-color="#38bdf8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity=".9"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1c2942"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <circle cx="930" cy="150" r="230" fill="url(#glow)"/>

    <!-- traces into the chip from the left -->
    <g fill="none" stroke="url(#trace)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M670 96H760l24 24h76"/>
      <path d="M690 150H860"/>
      <path d="M670 204H760l24-24h76"/>
    </g>
    <!-- traces out of the chip -->
    <g fill="none" stroke="#38bdf8" stroke-opacity=".75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1000 120h50l30-30h120"/>
      <path d="M1000 150h200"/>
      <path d="M1000 180h50l30 30h120"/>
      <path d="M900 80V52l-26-26V0"/>
      <path d="M930 80V0"/>
      <path d="M960 80V52l26-26V0"/>
      <path d="M900 220v28l-26 26v26"/>
      <path d="M930 220v80"/>
      <path d="M960 220v28l26 26v26"/>
    </g>
    <!-- pads -->
    <g fill="#0a0f1c" stroke="#38bdf8" stroke-width="2">
      <circle cx="1080" cy="90" r="5"/>
      <circle cx="1120" cy="150" r="5"/>
      <circle cx="1080" cy="210" r="5"/>
      <circle cx="874" cy="26" r="5"/>
      <circle cx="986" cy="274" r="5"/>
    </g>
    <g fill="#34d399">
      <circle cx="1160" cy="90" r="4"/>
      <circle cx="930" cy="30" r="4"/>
      <circle cx="1170" cy="210" r="4"/>
    </g>

    <!-- chip -->
    <g>
      <g stroke="#7dd3fc" stroke-width="3" stroke-linecap="round">
        <path d="M852 120h8M852 150h8M852 180h8M1000 120h8M1000 150h8M1000 180h8"/>
        <path d="M900 72v8M930 72v8M960 72v8M900 220v8M930 220v8M960 220v8"/>
      </g>
      <rect x="860" y="80" width="140" height="140" rx="16" fill="#0d1628" stroke="#38bdf8" stroke-width="2.5"/>
      <rect x="874" y="94" width="112" height="112" rx="10" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
      <!-- lens -->
      <circle cx="930" cy="150" r="34" fill="#0a0f1c" stroke="#7dd3fc" stroke-width="2.5"/>
      <circle cx="930" cy="150" r="22" fill="none" stroke="#38bdf8" stroke-opacity=".7" stroke-width="2"/>
      <circle cx="930" cy="150" r="10" fill="#38bdf8"/>
      <circle cx="921" cy="141" r="4" fill="#e0f2fe"/>
      <circle cx="976" cy="104" r="3" fill="#34d399"/>
    </g>

    <!-- text -->
    <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="64" y="128" font-size="46" font-weight="700" fill="#f1f5f9" letter-spacing=".3">Pham Nguyen Quoc Hung</text>
      <text x="66" y="170" font-size="22" font-weight="600" fill="#38bdf8">Embedded Software Engineer</text>
    </g>
    <rect x="66" y="192" width="44" height="3" rx="1.5" fill="#34d399"/>
    <text x="66" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94a3b8">embedded linux  /  ip cameras  /  real-time video</text>
  </g>
</svg>
